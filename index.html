<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Lakay</title>
    <!-- Icons Boxicons -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #141414;
            color: #fff;
            padding-bottom: 30px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Animasyon Ouvèti Netflix Lakay */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOutSplash 0.5s ease 2.8s forwards;
        }
        .splash-logo {
            color: #e50914;
            font-size: 38px;
            font-weight: 900;
            letter-spacing: 2px;
            animation: netflixAnim 2.5s forwards;
            white-space: nowrap;
        }
        @keyframes netflixAnim {
            0% { transform: scale(0.6); opacity: 0; filter: blur(10px); }
            40% { transform: scale(1.1); opacity: 1; filter: blur(0); }
            70% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.2); opacity: 1; }
        }
        @keyframes fadeOutSplash {
            to { opacity: 0; visibility: hidden; }
        }

        /* Ekran Who's Watching? ki gen 3 Pwofil */
        #profile-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #141414;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 4000;
            transition: opacity 0.5s ease;
        }
        .profile-screen-title {
            font-size: 24px;
            margin-bottom: 30px;
            color: #fff;
            font-weight: 500;
        }
        .profiles-grid {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .profile-card {
            text-align: center;
            cursor: pointer;
            width: 90px;
        }
        .profile-avatar {
            width: 85px;
            height: 85px;
            border-radius: 8px;
            overflow: hidden;
            background-color: #333;
            border: 2px solid transparent;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }
        .profile-card:hover .profile-avatar {
            border-color: #fff;
        }
        .profile-name {
            font-size: 13px;
            color: #aaa;
        }
        .profile-card:hover .profile-name {
            color: #fff;
        }

        header {
            background-color: #000;
            padding: 12px 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-bottom: 2px solid #e50914;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }
        header h1 {
            color: #e50914;
            font-size: 22px;
            letter-spacing: 1px;
            margin: 0 auto;
        }
        .add-content-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            position: absolute;
            left: 0;
        }
        .settings-icon-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            position: absolute;
            right: 0;
        }
        .search-box {
            width: 100%;
            padding: 8px 12px;
            background-color: #222;
            border: 1px solid #444;
            border-radius: 4px;
            color: white;
            font-size: 13px;
            outline: none;
        }

        .container {
            padding: 10px;
            flex-grow: 1;
        }
        .section-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }
        .section-title {
            font-size: 16px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .back-profiles-btn {
            background: #222;
            color: #e50914;
            border: 1px solid #e50914;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
        }
        .back-profiles-btn:hover {
            background: #e50914;
            color: #fff;
        }
        
        /* Layout afich yo: 5 pa liy an portrait, 7 pa liy an landscape */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }
        @media (orientation: landscape) {
            .movies-grid {
                grid-template-columns: repeat(7, 1fr);
            }
        }
        @media (max-width: 360px) {
            .movies-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .movie-card {
            background-color: #1f1f1f;
            border-radius: 4px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }
        .movie-card:hover {
            transform: scale(1.03);
        }
        .movie-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
        }
        .movie-info {
            padding: 4px;
            text-align: center;
        }
        .movie-title {
            font-size: 10px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-views {
            font-size: 9px;
            color: #aaa;
            margin-top: 2px;
        }

        /* Bouton 3 ti pwen yo (⋮) pou efase */
        .movie-options-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }
        .movie-options-btn:hover {
            background: #e50914;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 5000;
        }
        .modal-content {
            background-color: #1f1f1f;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 350px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .modal-content label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-size: 12px;
            color: #ccc;
        }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #2b2b2b;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .modal-content input:focus {
            border-color: #e50914;
        }
        .whatsapp-btn {
            background-color: #25d366;
            color: white;
            padding: 10px 15px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            font-size: 13px;
            display: inline-block;
            margin-top: 15px;
        }
        .submit-btn {
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background: #e50914;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .cancel-btn {
            padding: 8px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
        }

        /* Lektè Videyo Konbine */
        #player-screen {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #000;
            z-index: 2000;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            overflow-y: auto;
        }
        .player-top-bar {
            width: 100%;
            display: flex;
            justify-content: flex-start;
            padding: 10px;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }
        #mainVideo {
            width: 100%;
            max-height: 50vh;
            background: #000;
            display: none;
        }
        #youtubeIframe {
            width: 100%;
            height: 50vh;
            border: none;
            display: none;
        }
        .fullscreen-action-bar {
            width: 100%;
            padding: 12px;
            text-align: center;
            background: #111;
        }
        .fullscreen-btn {
            background: #e50914;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }
        .fullscreen-btn:hover {
            background: #b81d24;
        }
        .episodes-box {
            width: 100%;
            padding: 12px;
        }
        .episodes-title {
            font-size: 14px;
            margin-bottom: 8px;
            color: #e50914;
        }
        .episode-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 6px;
            background: #222;
            color: #fff;
            border: 1px solid #333;
            border-radius: 4px;
            text-align: left;
            cursor: pointer;
            font-size: 12px;
        }
        .episode-btn:hover {
            background: #e50914;
        }

        footer {
            text-align: center;
            padding: 15px;
            color: #777;
            font-size: 12px;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <!-- Animasyon Ouvèti Netflix Lakay -->
    <div id="splash-screen">
        <div class="splash-logo">NETFLIX LAKAY</div>
    </div>

    <!-- Ekran Who's Watching? -->
    <div id="profile-screen">
        <div class="profile-screen-title">Who's Watching?</div>
        <div class="profiles-grid">
            <div class="profile-card" onclick="selectProfile('other')">
                <div class="profile-avatar" style="background-color: #e50914;">🎬</div>
                <div class="profile-name">1: Lòt Fim</div>
            </div>
            <div class="profile-card" onclick="selectProfile('haitian')">
                <div class="profile-avatar" style="background-color: #b81d24;">🇭🇹</div>
                <div class="profile-name">2: Film Haïtien</div>
            </div>
            <div class="profile-card" onclick="selectProfile('series')">
                <div class="profile-avatar" style="background-color: #221f1f; border: 2px solid #555;">📺</div>
                <div class="profile-name">3: Seri</div>
            </div>
        </div>
    </div>

    <header>
        <div class="header-top">
            <button class="add-content-btn" onclick="openPinModal('add')">+ Ajoute Fim</button>
            <h1>Netflix Lakay</h1>
            <button class="settings-icon-btn" onclick="openSettings()">⚙️</button>
        </div>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Chache yon fim oswa seri..." onkeyup="filterContent()">
    </header>

    <div class="container">
        <!-- Seksyon Lòt Fim -->
        <div id="section-other" style="display:none;">
            <div class="section-header-bar">
                <h2 class="section-title">Lòt Fim 🎥</h2>
                <button class="back-profiles-btn" onclick="showProfiles()">⬅ Chanje Pwofil</button>
            </div>
            <div class="movies-grid" id="otherMoviesGrid"></div>
        </div>

        <!-- Seksyon Film Haïtien 🇭🇹 -->
        <div id="section-haitian" style="display:none;">
            <div class="section-header-bar">
                <h2 class="section-title">Film Haïtien 🇭🇹</h2>
                <button class="back-profiles-btn" onclick="showProfiles()">⬅ Chanje Pwofil</button>
            </div>
            <div class="movies-grid" id="haitianMoviesGrid"></div>
        </div>

        <!-- Seksyon Seri -->
        <div id="section-series" style="display:none;">
            <div class="section-header-bar">
                <h2 class="section-title">Séries 📺</h2>
                <button class="back-profiles-btn" onclick="showProfiles()">⬅ Chanje Pwofil</button>
            </div>
            <div class="movies-grid" id="seriesGrid"></div>
        </div>
    </div>

    <!-- Modal pou Antre PIN (Sekirize) -->
    <div class="modal" id="pinModal">
        <div class="modal-content">
            <h3 style="color:#e50914; margin-bottom:10px;">🔑 Sekirite Admin</h3>
            <p style="font-size:12px; color:#ccc;" id="pinInstructionText">Antre kòd sekirite a pou w kontinye:</p>
            
            <input type="password" id="adminPinInput" placeholder="••••" style="text-align:center; font-size:18px; letter-spacing:5px;">

            <button class="submit-btn" onclick="verifyPin()">Valide</button>
            <button class="cancel-btn" onclick="closePinModal()">Fèmen</button>
            <div id="pinErrorMsg" style="margin-top:10px; font-size:12px; color:#ff4d4d; font-weight:bold;"></div>
        </div>
    </div>

    <!-- Modal pou Ajoute Kontni -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3 style="color:#e50914; margin-bottom:10px;">Ajoute Kontni</h3>
            
            <label for="category">Kategori a:</label>
            <select id="category">
                <option value="other">Lòt Fim 🎬</option>
                <option value="haitian">Film Haïtien 🇭🇹</option>
                <option value="series">Seri 📺</option>
            </select>

            <label for="title">Tit Fim / Seri a:</label>
            <input type="text" id="title" placeholder="eg: Spider-Man">

            <label for="image">Lyen Imaj / Afich (URL):</label>
            <input type="url" id="image" placeholder="https://...">

            <label for="video">Lyen Videyo (URL / YouTube):</label>
            <input type="url" id="video" placeholder="https://...">

            <button class="submit-btn" onclick="saveMovieToFirebase()">Ajoute sou Sit la</button>
            <button class="cancel-btn" onclick="closeAddModal()">Anule</button>
            <div id="addMsg" style="margin-top:10px; font-size:12px; font-weight:bold;"></div>
        </div>
    </div>

    <!-- Modal Settings -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3 style="color:#e50914; margin-bottom:10px;">Paramèt</h3>
            <p style="font-size:13px; color:#ccc; line-height: 1.5;">Si w vle ajoute yon fim, ekri m sou WhatsApp.</p>
            <a href="https://wa.me/50942365530?text=Salitasyon,%20mwen%20vle%20ajoute%20yon%20fim%20sou%20Netflix%20Lakay" class="whatsapp-btn" target="_blank">
                💬 Ekri m sou WhatsApp
            </a>
            <br><br>
            <button onclick="closeSettings()" class="cancel-btn">Fèmen</button>
        </div>
    </div>

    <!-- Player / Écran Lecture -->
    <div id="player-screen">
        <div class="player-top-bar">
            <button class="back-btn" onclick="closePlayer()">⬅ Retounen</button>
        </div>
        <video id="mainVideo" controls playsinline></video>
        <iframe id="youtubeIframe" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        
        <div class="fullscreen-action-bar">
            <button class="fullscreen-btn" onclick="requestVideoFullscreen()">⛶ Pran Tout Ekran (Fullscreen)</button>
        </div>
        <div class="episodes-box" id="episodesBox"></div>
    </div>

    <footer>
        App Créé par P-52 Art
    </footer>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDvFYTT2a97ssnWw3QggL-uGWsh_QtePHE",
          authDomain: "netflixlakay06.firebaseapp.com",
          databaseURL: "https://netflixlakay06-default-rtdb.firebaseio.com",
          projectId: "netflixlakay06",
          storageBucket: "netflixlakay06.firebasestorage.app",
          messagingSenderId: "528486005894",
          appId: "1:528486005894:web:a624c1030ffc2b36fbe507"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentActiveProfile = 'other';
        let otherMovies = [];
        let haitianMovies = [];
        let seriesList = [];
        let movieKeys = { other: [], haitian: [], series: [] };

        let currentAction = 'add'; // 'add' oswa 'delete'
        let selectedMovieKeyToDelete = null;

        function selectProfile(type) {
            currentActiveProfile = type;
            document.getElementById('profile-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('profile-screen').style.display = 'none';
            }, 500);

            document.getElementById('section-other').style.display = (type === 'other') ? 'block' : 'none';
            document.getElementById('section-haitian').style.display = (type === 'haitian') ? 'block' : 'none';
            document.getElementById('section-series').style.display = (type === 'series') ? 'block' : 'none';
        }

        function showProfiles() {
            document.getElementById('profile-screen').style.display = 'flex';
            document.getElementById('profile-screen').style.opacity = '1';
        }

        // Koute Firebase an tan reyèl
        database.ref('movies').on('value', (snapshot) => {
            otherMovies = [];
            haitianMovies = [];
            seriesList = [];
            movieKeys = { other: [], haitian: [], series: [] };

            const data = snapshot.val();
            if (data) {
                Object.keys(data).forEach((key) => {
                    const item = data[key];
                    if (item.category === 'haitian') {
                        haitianMovies.push(item);
                        movieKeys.haitian.push(key);
                    } else if (item.category === 'series') {
                        seriesList.push(item);
                        movieKeys.series.push(key);
                    } else {
                        otherMovies.push(item);
                        movieKeys.other.push(key);
                    }
                });
            }
            renderAll();
        });

        function renderAll(filteredOther = otherMovies, filteredHaitian = haitianMovies, filteredSeries = seriesList) {
            const oGrid = document.getElementById('otherMoviesGrid');
            const hGrid = document.getElementById('haitianMoviesGrid');
            const sGrid = document.getElementById('seriesGrid');
            
            oGrid.innerHTML = filteredOther.length === 0 ? '<p style="color:#666; font-size:12px;">Poko gen fim.</p>' : '';
            hGrid.innerHTML = filteredHaitian.length === 0 ? '<p style="color:#666; font-size:12px;">Poko gen fim haitien.</p>' : '';
            sGrid.innerHTML = filteredSeries.length === 0 ? '<p style="color:#666; font-size:12px;">Poko gen seri.</p>' : '';

            filteredOther.forEach((m) => {
                const realIndex = otherMovies.indexOf(m);
                const key = movieKeys.other[realIndex];
                oGrid.innerHTML += `
                    <div class="movie-card">
                        <button class="movie-options-btn" onclick="promptDeleteMovie('${key}', event)" title="Efase fim sa a">⋮</button>
                        <div onclick="playOtherMovie(${realIndex})">
                            <img src="${m.image || m.poster}" alt="${m.title}">
                            <div class="movie-info">
                                <div class="movie-title">${m.title}</div>
                                <div class="movie-views">👁️ ${m.views || 0} vues</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            filteredHaitian.forEach((m) => {
                const realIndex = haitianMovies.indexOf(m);
                const key = movieKeys.haitian[realIndex];
                hGrid.innerHTML += `
                    <div class="movie-card">
                        <button class="movie-options-btn" onclick="promptDeleteMovie('${key}', event)" title="Efase fim sa a">⋮</button>
                        <div onclick="playHaitianMovie(${realIndex})">
                            <img src="${m.image || m.poster}" alt="${m.title}">
                            <div class="movie-info">
                                <div class="movie-title">${m.title}</div>
                                <div class="movie-views">👁️ ${m.views || 0} vues</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            filteredSeries.forEach((s) => {
                const realIndex = seriesList.indexOf(s);
                const key = movieKeys.series[realIndex];
                sGrid.innerHTML += `
                    <div class="movie-card">
                        <button class="movie-options-btn" onclick="promptDeleteMovie('${key}', event)" title="Efase seri sa a">⋮</button>
                        <div onclick="openSeries(${realIndex})">
                            <img src="${s.image || s.poster}" alt="${s.title}">
                            <div class="movie-info">
                                <div class="movie-title">${s.title}</div>
                                <div class="movie-views">👁️ ${s.views || 0} vues</div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // Fonksyon rechèch ki mache an tan reyèl
        function filterContent() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const fOther = otherMovies.filter(m => m.title.toLowerCase().includes(query));
            const fHaitian = haitianMovies.filter(m => m.title.toLowerCase().includes(query));
            const fSeries = seriesList.filter(s => s.title.toLowerCase().includes(query));

            renderAll(fOther, fHaitian, fSeries);
        }

        const videoPlayer = document.getElementById('mainVideo');
        const youtubeIframe = document.getElementById('youtubeIframe');

        function extractYouTubeId(url) {
            let regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            let match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function playMedia(url) {
            let ytId = extractYouTubeId(url);
            if (ytId) {
                videoPlayer.pause();
                videoPlayer.style.display = 'none';
                youtubeIframe.src = "https://www.youtube.com/embed/" + ytId + "?autoplay=1";
                youtubeIframe.style.display = 'block';
            } else {
                youtubeIframe.src = '';
                youtubeIframe.style.display = 'none';
                videoPlayer.src = url;
                videoPlayer.style.display = 'block';
                videoPlayer.play();
            }
            document.getElementById('player-screen').style.display = 'flex';
        }

        function addViewCount(category, index) {
            let key;
            let currentViews = 0;
            if(category === 'haitian') {
                key = movieKeys.haitian[index];
                currentViews = haitianMovies[index].views || 0;
            } else if(category === 'series') {
                key = movieKeys.series[index];
                currentViews = seriesList[index].views || 0;
            } else {
                key = movieKeys.other[index];
                currentViews = otherMovies[index].views || 0;
            }

            if(key) {
                let viewedKey = "viewed_" + key;
                if (!localStorage.getItem(viewedKey)) {
                    database.ref('movies/' + key).update({ views: currentViews + 1 });
                    localStorage.setItem(viewedKey, "true");
                }
            }
        }

        function playOtherMovie(i) {
            addViewCount('other', i);
            document.getElementById('episodesBox').innerHTML = '';
            playMedia(otherMovies[i].video);
        }

        function playHaitianMovie(i) {
            addViewCount('haitian', i);
            document.getElementById('episodesBox').innerHTML = '';
            playMedia(haitianMovies[i].video);
        }

        function openSeries(i) {
            addViewCount('series', i);
            const series = seriesList[i];
            const epBox = document.getElementById('episodesBox');
            epBox.innerHTML = `<h3 class="episodes-title">${series.title} - Épisodes</h3>`;
            
            if(series.episodes && Array.isArray(series.episodes)) {
                series.episodes.forEach(ep => {
                    epBox.innerHTML += `
                        <button class="episode-btn" onclick="playEpisode('${ep.video}')">▶ ${ep.name}</button>
                    `;
                });
                playMedia(series.episodes[0].video);
            } else {
                playMedia(series.video);
            }
        }

        function playEpisode(url) {
            playMedia(url);
        }

        function closePlayer() {
            videoPlayer.pause();
            videoPlayer.src = '';
            youtubeIframe.src = '';
            document.getElementById('player-screen').style.display = 'none';
        }

        function requestVideoFullscreen() {
            let activeEl = (youtubeIframe.style.display === 'block') ? youtubeIframe : videoPlayer;
            if (activeEl.requestFullscreen) {
                activeEl.requestFullscreen();
            } else if (activeEl.webkitRequestFullscreen) {
                activeEl.webkitRequestFullscreen();
            } else if (activeEl.msRequestFullscreen) {
                activeEl.msRequestFullscreen();
            }
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
        }

        /* Modal PIN pou Ajoute / Efase Kontni */
        function openPinModal(action, key = null) {
            currentAction = action;
            selectedMovieKeyToDelete = key;
            document.getElementById('adminPinInput').value = '';
            document.getElementById('pinErrorMsg').textContent = '';
            
            if(action === 'delete') {
                document.getElementById('pinInstructionText').textContent = "Antre kòd sekirite pou efase fim/seri sa a:";
            } else {
                document.getElementById('pinInstructionText').textContent = "Antre kòd sekirite a pou w ka ajoute fim:";
            }
            
            document.getElementById('pinModal').style.display = 'flex';
        }

        function promptDeleteMovie(key, event) {
            event.stopPropagation(); // Anpeche fim nan jwe lè w klike 3 ti pwen yo
            openPinModal('delete', key);
        }

        function closePinModal() {
            document.getElementById('pinModal').style.display = 'none';
        }

        function verifyPin() {
            const inputPin = document.getElementById('adminPinInput').value;
            if (inputPin === "1526") {
                closePinModal();
                if(currentAction === 'add') {
                    document.getElementById('addModal').style.display = 'flex';
                } else if(currentAction === 'delete' && selectedMovieKeyToDelete) {
                    database.ref('movies/' + selectedMovieKeyToDelete).remove().then(() => {
                        alert("✅ Fim/Seri a efase ak siksè!");
                    }).catch((err) => {
                        alert("Erè: " + err.message);
                    });
                }
            } else {
                document.getElementById('pinErrorMsg').textContent = "❌ Kòd sekirite a pa bon!";
            }
        }

        function closeAddModal() {
            document.getElementById('addModal').style.display = 'none';
            document.getElementById('addMsg').textContent = '';
        }

        function saveMovieToFirebase() {
            const category = document.getElementById('category').value;
            const title = document.getElementById('title').value;
            const image = document.getElementById('image').value;
            const video = document.getElementById('video').value;
            const msg = document.getElementById('addMsg');

            if (!title || !image || !video) {
                msg.style.color = "#ff4d4d";
                msg.textContent = "⚠️ Tanpri ranpli tout kaz yo!";
                return;
            }

            const newMovieRef = database.ref('movies').push();
            newMovieRef.set({
                title: title,
                image: image,
                video: video,
                category: category,
                views: 0,
                createdAt: Date.now()
            }).then(() => {
                msg.style.color = "#4bb543";
                msg.textContent = "✅ Kontni an ajoute ak siksè!";
                document.getElementById('title').value = '';
                document.getElementById('image').value = '';
                document.getElementById('video').value = '';
                setTimeout(() => { closeAddModal(); }, 1200);
            }).catch((err) => {
                msg.style.color = "#ff4d4d";
                msg.textContent = "Erè: " + err.message;
            });
        }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
    </script>
</body>
</html>
